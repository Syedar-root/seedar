name: Test Release

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      test_version: ${{ steps.meta.outputs.test_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Validate CLI typecheck
        run: pnpm typecheck:cli

      - name: Validate runtime compose template
        run: docker compose --env-file deploy/templates/runtime.env.example -f deploy/templates/docker-compose.runtime.yml config

      - name: Resolve test metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          TEST_VERSION="${VERSION}-test.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "test_version=$TEST_VERSION" >> "$GITHUB_OUTPUT"

  publish-test-server-image:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
      HAS_DOCKER_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server test image
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/seedar-server:test
            ${{ env.DOCKER_NAMESPACE }}/seedar-server:test-${{ needs.validate.outputs.short_sha }}

      - name: Verify published server test image manifest
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SERVER_IMAGE="${{ env.DOCKER_NAMESPACE }}/seedar-server:test-${{ needs.validate.outputs.short_sha }}"

          echo "Inspecting $SERVER_IMAGE"
          docker buildx imagetools inspect "$SERVER_IMAGE"
          docker buildx imagetools inspect "$SERVER_IMAGE" | grep -q 'linux/arm64'

      - name: Skip Docker image publish
        if: env.HAS_DOCKER_CREDENTIALS != 'true'
        run: echo "DockerHub credentials are not configured. Skipping test image publish."

  publish-test-web-image:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
      HAS_DOCKER_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web test image
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/seedar-web:test
            ${{ env.DOCKER_NAMESPACE }}/seedar-web:test-${{ needs.validate.outputs.short_sha }}

      - name: Verify published web test image manifest
        if: env.HAS_DOCKER_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WEB_IMAGE="${{ env.DOCKER_NAMESPACE }}/seedar-web:test-${{ needs.validate.outputs.short_sha }}"

          echo "Inspecting $WEB_IMAGE"
          docker buildx imagetools inspect "$WEB_IMAGE"
          docker buildx imagetools inspect "$WEB_IMAGE" | grep -q 'linux/arm64'

      - name: Skip Docker image publish
        if: env.HAS_DOCKER_CREDENTIALS != 'true'
        run: echo "DockerHub credentials are not configured. Skipping test image publish."

  publish-test-cli:
    needs: validate
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @syedar/seedar-cli build

      - name: Pack CLI test package
        id: cli_pack
        working-directory: apps/cli
        shell: bash
        run: |
          pnpm pkg set "version=${{ needs.validate.outputs.test_version }}"
          PACKAGE_FILE=$(npm pack --silent)
          echo "package_file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload CLI test package artifact
        uses: actions/upload-artifact@v4
        with:
          name: seedar-cli-test-${{ needs.validate.outputs.short_sha }}
          path: apps/cli/${{ steps.cli_pack.outputs.package_file }}
          if-no-files-found: error

      - name: Publish CLI test package
        if: env.HAS_NPM_TOKEN == 'true'
        working-directory: apps/cli
        run: pnpm publish --tag test --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip CLI npm publish
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "NPM_TOKEN is not configured. Uploaded the CLI test package as a workflow artifact only."
