name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on master
        shell: bash
        run: |
          git fetch origin master --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
            echo "Tag ${GITHUB_REF_NAME} is not based on master."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_namespace=${DOCKERHUB_USERNAME}" >> "$GITHUB_OUTPUT"
          node -e "const pkg=require('./apps/cli/package.json'); const version=process.argv[1]; if (pkg.version !== version) { console.error(`apps/cli/package.json version ${pkg.version} does not match tag ${version}`); process.exit(1); }" "$VERSION"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.docker_namespace }}/seedar-server:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.docker_namespace }}/seedar-server:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.docker_namespace }}/seedar-web:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.docker_namespace }}/seedar-web:latest

      - name: Verify published image manifests
        shell: bash
        run: |
          set -euo pipefail

          SERVER_IMAGE="${{ steps.release.outputs.docker_namespace }}/seedar-server:${{ steps.release.outputs.version }}"
          WEB_IMAGE="${{ steps.release.outputs.docker_namespace }}/seedar-web:${{ steps.release.outputs.version }}"

          echo "Inspecting $SERVER_IMAGE"
          docker buildx imagetools inspect "$SERVER_IMAGE"
          docker buildx imagetools inspect "$SERVER_IMAGE" | grep -q 'linux/arm64'

          echo "Inspecting $WEB_IMAGE"
          docker buildx imagetools inspect "$WEB_IMAGE"
          docker buildx imagetools inspect "$WEB_IMAGE" | grep -q 'linux/arm64'

      - name: Build CLI
        run: pnpm --filter @syedar/seedar-cli build

      - name: Publish CLI package
        working-directory: apps/cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
