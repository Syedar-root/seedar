name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOCKER_NAMESPACE: ${{ vars.DOCKER_NAMESPACE != '' && vars.DOCKER_NAMESPACE || 'syedarhandsome' }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || vars.DOCKER_NAMESPACE != '' && vars.DOCKER_NAMESPACE || 'syedarhandsome' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on master
        shell: bash
        run: |
          git fetch origin master --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
            echo "Tag ${GITHUB_REF_NAME} is not based on master."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${DOCKER_NAMESPACE:-}" ]; then
            echo "::error::DOCKER_NAMESPACE is empty. Set repository variable DOCKER_NAMESPACE or use default."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is empty. Docker image release cannot continue."
            exit 1
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is empty. CLI release cannot continue."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const pkg=require('./apps/cli/package.json'); const version=process.argv[1]; if (pkg.version !== version) { console.error(`apps/cli/package.json version ${pkg.version} does not match tag ${version}`); process.exit(1); }" "$VERSION"
        env:
          DOCKER_NAMESPACE: ${{ env.DOCKER_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish credentials and target version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.release.outputs.version }}"
          PACKAGE_NAME=$(node -p "require('./apps/cli/package.json').name")

          TMP_NPMRC="$(mktemp)"
          trap 'rm -f "$TMP_NPMRC"' EXIT
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > "$TMP_NPMRC"
          NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm whoami >/dev/null

          if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${VERSION} already exists on npm. Refuse partial re-release."
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin >/dev/null 2>&1
          docker logout >/dev/null 2>&1 || true
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build web dist
        run: |
          pnpm --filter @seedar/types build
          pnpm --filter @seedar/web-client build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-release
          path: apps/web-client/dist
          if-no-files-found: error

  build-server-image:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            platform_id: amd64
          - platform: linux/arm64
            platform_id: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        if: matrix.platform_id == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_NAMESPACE }}/seedar-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=seedar-server-image-${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=seedar-server-image-${{ matrix.platform_id }}

      - name: Export server digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload server digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-digests-${{ matrix.platform_id }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish-server-image:
    needs:
      - validate
      - build-server-image
    runs-on: ubuntu-latest

    steps:
      - name: Download server digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and verify server image manifest
        shell: bash
        run: |
          set -euo pipefail

          SERVER_IMAGE="${{ env.DOCKER_NAMESPACE }}/seedar-server:${{ needs.validate.outputs.version }}"
          SERVER_REPO="${{ env.DOCKER_NAMESPACE }}/seedar-server"

          cd /tmp/digests

          DIGEST_ARGS=()
          for DIGEST_FILE in *; do
            DIGEST_ARGS+=("${SERVER_REPO}@sha256:${DIGEST_FILE}")
          done

          docker buildx imagetools create \
            -t "${SERVER_REPO}:${{ needs.validate.outputs.version }}" \
            -t "${SERVER_REPO}:latest" \
            "${DIGEST_ARGS[@]}"

          echo "Inspecting $SERVER_IMAGE"
          docker buildx imagetools inspect "$SERVER_IMAGE"
          docker buildx imagetools inspect "$SERVER_IMAGE" | grep -q 'linux/arm64'

  build-web-image:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            platform_id: amd64
          - platform: linux/arm64
            platform_id: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-release
          path: apps/web-client/dist

      - name: Setup QEMU
        if: matrix.platform_id == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_NAMESPACE }}/seedar-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=seedar-web-image-${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=seedar-web-image-${{ matrix.platform_id }}

      - name: Export web digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload web digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-digests-${{ matrix.platform_id }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish-web-image:
    needs:
      - validate
      - build-web-image
      - publish-server-image
    runs-on: ubuntu-latest

    steps:
      - name: Download web digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: web-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and verify web image manifest
        shell: bash
        run: |
          set -euo pipefail

          WEB_IMAGE="${{ env.DOCKER_NAMESPACE }}/seedar-web:${{ needs.validate.outputs.version }}"
          WEB_REPO="${{ env.DOCKER_NAMESPACE }}/seedar-web"

          cd /tmp/digests

          DIGEST_ARGS=()
          for DIGEST_FILE in *; do
            DIGEST_ARGS+=("${WEB_REPO}@sha256:${DIGEST_FILE}")
          done

          docker buildx imagetools create \
            -t "${WEB_REPO}:${{ needs.validate.outputs.version }}" \
            -t "${WEB_REPO}:latest" \
            "${DIGEST_ARGS[@]}"

          echo "Inspecting $WEB_IMAGE"
          docker buildx imagetools inspect "$WEB_IMAGE"
          docker buildx imagetools inspect "$WEB_IMAGE" | grep -q 'linux/arm64'

  publish-cli:
    needs:
      - validate
      - publish-server-image
      - publish-web-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @syedar/seedar-cli build

      - name: Publish CLI package
        working-directory: apps/cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cleanup-tag-on-failure:
    needs:
      - validate
      - build-server-image
      - publish-server-image
      - build-web-image
      - publish-web-image
      - publish-cli
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.validate.result == 'failure' || needs.build-server-image.result == 'failure' || needs.publish-server-image.result == 'failure' || needs.build-web-image.result == 'failure' || needs.publish-web-image.result == 'failure' || needs.publish-cli.result == 'failure') }}
    steps:
      - name: Delete failing tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted tag ${tag}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Tag ${tag} was already missing or deleted.`);
                return;
              }
              throw error;
            }
