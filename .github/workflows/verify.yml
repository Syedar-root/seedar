name: Verify

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Validate CLI typecheck
        run: pnpm typecheck:cli

      - name: Validate runtime compose template
        run: docker compose --env-file deploy/templates/runtime.env.example -f deploy/templates/docker-compose.runtime.yml config

      - name: Validate legacy compose template
        run: docker compose -f deploy/docker-compose.prod.yml config
        env:
          AI_CHECKPOINT_PG_PASSWORD: change_me_pg_password
          AI_CHECKPOINT_PG_URL: postgresql://postgres:change_me_pg_password@postgres:5432/postgres
