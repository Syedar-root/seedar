name: seedar-prod

services:
  mysql:
    image: mysql:8.4
    container_name: seedar-mysql
    restart: unless-stopped
    env_file:
      - ../apps/server/.env.production
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - seedar-net

  postgres:
    image: postgres:16-alpine
    container_name: seedar-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AI_CHECKPOINT_PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d postgres",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - seedar-net

  server:
    image: syedarhandsome/seedar-server:${SEEDAR_VERSION:-latest}
    container_name: seedar-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../apps/server/.env.production
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      AI_CHECKPOINT_PG_URL: ${AI_CHECKPOINT_PG_URL}
      PORT: 3000
    ports:
      - "${SERVER_PORT:-8090}:3000"
    networks:
      - seedar-net

  migrate:
    image: syedarhandsome/seedar-server:${SEEDAR_VERSION:-latest}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../apps/server/.env.production
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      AI_CHECKPOINT_PG_URL: ${AI_CHECKPOINT_PG_URL}
      PORT: 3000
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "-d",
        "dist/config/typeorm.datasource.js",
        "migration:run",
      ]
    networks:
      - seedar-net

  web:
    image: syedarhandsome/seedar-web:${SEEDAR_VERSION:-latest}
    container_name: seedar-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - seedar-net

volumes:
  mysql_data:
  postgres_data:

networks:
  seedar-net:
    driver: bridge
