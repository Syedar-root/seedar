name: ${SEEDAR_PROJECT_NAME}

services:
  mysql:
    image: mysql:8.4
    container_name: ${SEEDAR_PROJECT_NAME}-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - "${SEEDAR_INSTALL_ROOT}/data/mysql:/var/lib/mysql"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - seedar-net

  server:
    image: seedarhq/seedar-server:${SEEDAR_VERSION}
    container_name: ${SEEDAR_PROJECT_NAME}-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      AES_SECRET: ${AES_SECRET}
      PORT: 3000
    ports:
      - "${SERVER_PORT}:3000"
    networks:
      - seedar-net

  migrate:
    image: seedarhq/seedar-server:${SEEDAR_VERSION}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      AES_SECRET: ${AES_SECRET}
      PORT: 3000
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "-d",
        "dist/config/typeorm.datasource.js",
        "migration:run",
      ]
    networks:
      - seedar-net

  web:
    image: seedarhq/seedar-web:${SEEDAR_VERSION}
    container_name: ${SEEDAR_PROJECT_NAME}-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT}:80"
    networks:
      - seedar-net

networks:
  seedar-net:
    driver: bridge
